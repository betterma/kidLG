# 仅部署站点壳（html/css/js/assets/config）。
# data/*.json 不触发流水线：线上前端直读仓库 main 的 raw JSON，push 即可生效。
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "**/*.html"
      - "css/**"
      - "js/**"
      - "assets/**"
      - "config.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "手动发布壳的原因（可选）"
        required: false
        default: "manual shell deploy"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage site files
        run: |
          mkdir -p _site
          # data/ 作为 raw 失败时的回退副本一并打包
          cp -r index.html config.json css js assets data _site/
          if [ -d docs ]; then cp -r docs _site/; fi
          if [ -f README.md ]; then cp README.md _site/; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
